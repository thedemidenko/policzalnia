media:
  input: public/media
  output: /media

components:
  zrodla:
    label: Źródła
    type: object
    list: true
    fields:
      - { name: nazwa, label: Nazwa, type: string }
      - { name: url, label: Adres URL, type: string }
  faq:
    label: FAQ
    type: object
    list: true
    fields:
      - { name: pytanie, label: Pytanie (kończy się „?”), type: string }
      - { name: odpowiedz, label: Odpowiedź, type: text }

content:
  - name: kalkulatory
    label: Kalkulatory
    type: collection
    path: src/content/kalkulatory
    filename: "{fields.slug}.md"
    view:
      fields: [nazwa_krotka, sekcja, updated, draft]
      primary: nazwa_krotka
      sort: [sekcja, nazwa_krotka]
    fields:
      - { name: slug, label: Adres (np. kalkulator-vat), type: string, required: true, description: "Małe litery, cyfry, myślniki. Bez roku. Po publikacji nie zmieniać." }
      - name: sekcja
        label: Dział
        type: select
        required: true
        options:
          values: [{ value: praca, label: Praca i płace }, { value: firma, label: Firma i podatki }, { value: kredyty, label: Kredyty i leasing }, { value: oszczedzanie, label: Oszczędzanie i inwestycje }]
      - name: kalkulator
        label: Mechanizm kalkulatora
        type: select
        required: true
        options:
          values:
            - { value: vat, label: VAT netto-brutto }
            - { value: odsetki, label: Odsetki ustawowe i handlowe }
            - { value: odsetki-podatkowe, label: Odsetki podatkowe (za zwłokę) }
            - { value: staz, label: Staż pracy }
            - { value: urlop, label: Wymiar urlopu }
            - { value: delegacja, label: Delegacja krajowa }
            - { value: macierzynski, label: Urlop macierzyński i rodzicielski }
            - { value: ekwiwalent, label: Ekwiwalent za urlop }
            - { value: l4, label: Zwolnienie lekarskie (L4) }
            - { value: dni-robocze, label: Dni robocze }
            - { value: nadgodziny, label: Nadgodziny }
            - { value: dzielo, label: Umowa o dzieło }
            - { value: zlecenie, label: Umowa zlecenie }
            - { value: leasing, label: Leasing samochodu }
            - { value: lokaty, label: Lokaty }
            - { value: nadplata, label: Nadpłata kredytu }
            - { value: ppk, label: PPK }
            - { value: procent-skladany, label: Procent składany }
            - { value: obligacje, label: Obligacje skarbowe }
            - { value: ike, label: IKE }
            - { value: inflacja, label: Inflacja }
            - { value: inwestycje, label: Kalkulator inwestycyjny }
            - { value: ikze, label: IKZE }
            - { value: umowy-terminowe, label: Umowy na czas określony }
            - { value: odsetki-zus, label: Odsetki od zaległości ZUS }
            - { value: dieta-zagraniczna, label: Dieta zagraniczna }
            - { value: maly-zus, label: Mały ZUS Plus }
            - { value: wspolne-rozliczenie, label: Wspólne rozliczenie małżonków }
      - { name: title, label: Tytuł H1, type: string, required: true }
      - { name: nazwa_krotka, label: Nazwa krótka (menu, linki), type: string }
      - { name: meta_title, label: Meta title, type: string, required: true, description: "Kończy się „ | Policzalnia”; zamiast „:” piszemy „ - ”." }
      - { name: meta_description, label: Meta description, type: text, required: true }
      - { name: lead, label: Lead (2 zdania), type: text, required: true }
      - { name: body, label: Treść pod kalkulatorem, type: rich-text }
      - { name: faq, component: faq }
      - { name: powiazane, label: Powiązane kalkulatory (adresy), type: string, list: true }
      - { name: poradniki, label: Powiązane poradniki (adresy), type: string, list: true }
      - { name: zrodla, component: zrodla }
      - { name: autor, label: Autor / recenzent, type: reference, options: { collection: autorzy, value: "{slug}", label: "{imie}" }, required: true }
      - { name: updated, label: Data aktualizacji, type: date, required: true }
      - { name: draft, label: Szkic (niepublikowany), type: boolean, default: true }

  - name: poradniki
    label: Poradniki
    type: collection
    path: src/content/poradniki
    filename: "{fields.slug}.md"
    view:
      fields: [title, date, draft]
      sort: [date]
    fields:
      - { name: slug, label: Adres, type: string, required: true }
      - { name: title, label: Tytuł H1, type: string, required: true }
      - { name: meta_title, label: Meta title, type: string, required: true }
      - { name: meta_description, label: Meta description, type: text, required: true }
      - { name: lead, label: Lead, type: text, required: true }
      - { name: kalkulatory, label: Kalkulatory, do których linkuje (adresy), type: string, list: true }
      - { name: body, label: Treść, type: rich-text }
      - { name: faq, component: faq }
      - { name: zrodla, component: zrodla }
      - { name: autor, label: Autor, type: reference, options: { collection: autorzy, value: "{slug}", label: "{imie}" }, required: true }
      - { name: date, label: Data publikacji, type: date, required: true }
      - { name: updated, label: Data aktualizacji, type: date }
      - { name: draft, label: Szkic, type: boolean, default: true }

  - name: dzialy
    label: Działy
    type: collection
    path: src/content/dzialy
    filename: "{fields.slug}.md"
    view: { fields: [title, kolejnosc] }
    fields:
      - { name: slug, label: Adres (nie zmieniać), type: string, required: true }
      - { name: title, label: Nazwa, type: string, required: true }
      - { name: meta_title, label: Meta title, type: string, required: true }
      - { name: meta_description, label: Meta description, type: text, required: true }
      - { name: lead, label: Lead, type: text, required: true }
      - { name: kolejnosc, label: Kolejność w menu, type: number }
      - { name: body, label: Treść pod listą, type: rich-text }

  - name: strony
    label: Strony informacyjne
    type: collection
    path: src/content/strony
    filename: "{fields.slug}.md"
    fields:
      - { name: slug, label: Adres, type: string, required: true }
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: meta_title, label: Meta title, type: string, required: true }
      - { name: meta_description, label: Meta description, type: text, required: true }
      - { name: stopka, label: Link w stopce, type: boolean, default: true }
      - { name: body, label: Treść, type: rich-text }

  - name: autorzy
    label: Autorzy
    type: collection
    path: src/content/autorzy
    filename: "{fields.slug}.md"
    fields:
      - { name: slug, label: Identyfikator, type: string, required: true }
      - { name: imie, label: Imię i nazwisko, type: string, required: true }
      - { name: rola, label: Rola / kwalifikacje, type: string, required: true }
      - { name: url, label: Strona autora, type: string }
      - { name: body, label: Bio, type: rich-text }

  - name: ustawienia
    label: Ustawienia strony
    type: file
    path: src/site.json
    format: json
    fields:
      - { name: name, label: Nazwa, type: string }
      - { name: tagline, label: Hasło, type: string }
      - { name: email, label: E-mail kontaktowy, type: string }
      - { name: noindex, label: Ukryj przed Google (noindex), type: boolean }
      - { name: reklamy, label: Włącz sloty reklamowe, type: boolean }
